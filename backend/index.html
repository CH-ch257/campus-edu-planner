<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园资料AI检索助手</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="/static/docx-preview.min.js"></script>
    <style>
        body { background-color: #f5f7fb; padding: 20px; }
        .chat-box { height: 400px; overflow-y: auto; background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        .source-tag { font-size: 12px; color: #666; margin-top: 8px; padding: 4px 8px; background: #f0f7ff; border-radius: 6px; }
        .doc-actions { font-size: 12px; margin-top: 4px; }
        .admin-panel { display: none; }
        .doc-title { cursor: pointer; color: #0d6efd; }
        .doc-title:hover { text-decoration: underline; }
        .cat-header { cursor: pointer; }
        .cat-header:hover { background: #e9ecef; }
        .cat-arrow { transition: transform 0.2s; display: inline-block; }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="text-center mb-4">📚 校园资料AI检索助手</h2>
        <div class="row">
            <div class="col-md-8">
                <div class="card mb-4">
                    <div class="card-header bg-primary text-white">智能问答（学生/管理员均可使用）</div>
                    <div class="card-body">
                        <div class="chat-box mb-3" id="chatBox">
                            <div class="text-muted">你好！我是校园资料助手，可以问我关于上传文档里的内容哦~</div>
                        </div>
                        <div class="input-group">
                            <input type="text" class="form-control" id="questionInput" placeholder="输入你的问题...">
                            <button class="btn btn-primary" onclick="askQuestion()">提问</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card mb-4">
                    <div class="card-header">📂 文档库（按分类折叠，点分类展开）</div>
                    <div class="card-body">
                        <input type="text" class="form-control mb-2" id="searchInput" placeholder="搜索文件名..." oninput="searchDocs()">
                        <button class="btn btn-sm btn-outline-secondary w-100 mb-2" id="sortBtn" onclick="toggleSort()">排序：按上传时间</button>
                        <div id="docList"><div class="text-muted">加载中...</div></div>
                    </div>
                </div>
                <div class="card admin-panel" id="adminPanel">
                    <div class="card-header">🔧 管理员控制台（已解锁）</div>
                    <div class="card-body">
                        <input type="file" class="form-control mb-2" id="fileInput" accept=".pdf,.doc,.docx,.txt">
                        <button class="btn btn-success w-100 mb-2" onclick="uploadDoc()">上传文档</button>
                        <button class="btn btn-outline-secondary w-100 mt-2" onclick="logoutAdmin()">退出管理员模式</button>
                    </div>
                </div>
                <div class="card" id="loginPanel">
                    <div class="card-header">🔑 管理员登录</div>
                    <div class="card-body">
                        <input type="password" class="form-control mb-2" id="adminSecret" placeholder="输入管理员密钥">
                        <button class="btn btn-primary w-100" onclick="loginAdmin()">登录管理员</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="verModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="verModalTitle">历史版本</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="verModalContent"></div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="docModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="docModalTitle">文档详情</h5>
                    <div class="d-flex gap-2">
                        <a id="docFileBtn" href="#" target="_blank" class="btn btn-sm btn-outline-success">📄 打开原文件</a>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                </div>
                <div class="modal-body" id="docModalContent" style="white-space: pre-wrap; max-height: 600px; overflow-y: auto;"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE = "http://127.0.0.1:8000";
        let sortMode = 'time';
        const catColors = {
            '培养方案': 'bg-primary',
            '考试通知': 'bg-danger',
            '课件资料': 'bg-success',
            '行政通知': 'bg-warning',
            '社团文件': 'bg-secondary',
            '未分类': 'bg-info'
        };

        window.onload = function() {
            loadDocs();
            if (localStorage.getItem('adminSecret') === 'admin123456') {
                showAdminPanel();
                loadDocs();
            }
        }

        function showAdminPanel() {
            document.getElementById('adminPanel').style.display = 'block';
            document.getElementById('loginPanel').style.display = 'none';
        }

        function loginAdmin() {
            if (document.getElementById('adminSecret').value === 'admin123456') {
                localStorage.setItem('adminSecret', 'admin123456');
                showAdminPanel();
                loadDocs();
                alert('管理员登录成功');
            } else {
                alert('密钥错误');
            }
        }

        function logoutAdmin() {
            localStorage.removeItem('adminSecret');
            location.reload();
        }

        function getSecret() {
            return localStorage.getItem('adminSecret') || '';
        }

        function toggleSort() {
            sortMode = sortMode === 'time' ? 'name' : 'time';
            document.getElementById('sortBtn').innerText = sortMode === 'time' ? '排序：按文件名' : '排序：按上传时间';
            loadDocs();
        }

        async function loadDocs() {
            const res = await fetch(`${API_BASE}/documents/`);
            let docs = await res.json();
            if (sortMode === 'name') {
                docs = docs.sort((a,b) => a.filename.localeCompare(b.filename, 'zh'));
            }
            renderDocList(docs);
        }

        async function searchDocs() {
            const k = document.getElementById('searchInput').value.trim();
            if (!k) return loadDocs();
            const res = await fetch(`${API_BASE}/documents/search/?keyword=${encodeURIComponent(k)}`);
            let docs = await res.json();
            if (sortMode === 'name') docs = docs.sort((a,b) => a.filename.localeCompare(b.filename, 'zh'));
            renderDocList(docs);
        }

        function renderDocList(docs) {
            const el = document.getElementById('docList');
            if (!docs.length) {
                el.innerHTML = '<div class="text-muted">暂无文档</div>';
                return;
            }
            const isAdmin = !!localStorage.getItem('adminSecret');
            // 按分类分组
            const groups = {};
            docs.forEach(d => {
                const cat = d.category || '未分类';
                if (!groups[cat]) groups[cat] = [];
                groups[cat].push(d);
            });
            let html = '';
            let idx = 0;
            Object.keys(groups).forEach(cat => {
                const list = groups[cat];
                const color = catColors[cat] || 'bg-info';
                html += `
                    <div class="card mb-2">
                        <div class="card-header cat-header py-2" data-bs-toggle="collapse" data-bs-target="#cat-${idx}">
                            <span class="badge ${color}">${cat}</span>
                            <span class="text-muted small">${list.length}个文档</span>
                            <span class="cat-arrow float-end small">▸</span>
                        </div>
                        <div id="cat-${idx}" class="collapse">
                            <div class="card-body py-2">
                                ${list.map(d => docItemHtml(d, isAdmin)).join('')}
                            </div>
                        </div>
                    </div>`;
                idx++;
            });
            el.innerHTML = html;
        }

        function docItemHtml(d, isAdmin) {
            return `
                <div class="border-bottom py-2">
                    <div class="doc-title fw-bold" onclick="viewDoc(${d.id})">${d.filename}</div>
                    <span class="badge bg-secondary">v${d.version}</span>
                    ${isAdmin ? `<div class="doc-actions">
                        <button class="btn btn-sm btn-outline-primary" onclick="editCat(${d.id},'${d.category}')">改分类</button>
                        <button class="btn btn-sm btn-outline-secondary" onclick="showVer(${d.id})">历史版本</button>
                        <button class="btn btn-sm btn-outline-danger" onclick="delDoc(${d.id})">删除</button>
                    </div>` : ''}
                </div>`;
        }

        async function viewDoc(id) {
            const res = await fetch(`${API_BASE}/documents/${id}`);
            const doc = await res.json();
            document.getElementById('docModalTitle').innerText = doc.filename;
            document.getElementById('docFileBtn').href = `${API_BASE}/file/${id}`;
            document.getElementById('docModalContent').innerText = doc.content;
            new bootstrap.Modal('#docModal').show();
        }

        async function askQuestion() {
            const q = document.getElementById('questionInput').value.trim();
            if (!q) return;
            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML += `<div class="text-end mb-2"><span class="badge bg-primary p-2">我：${q}</span></div>`;
            document.getElementById('questionInput').value = '';
            const res = await fetch(`${API_BASE}/ask/?q=${encodeURIComponent(q)}`, {method:'POST'});
            const data = await res.json();
            let src = '';
            if (data.sources && data.sources.length) src = `<div class="source-tag">📚 参考：${data.sources.map(s=>s.doc_name).join('、')}</div>`;
            chatBox.innerHTML += `<div class="mb-2"><span class="badge bg-light text-dark p-2">AI：${data.answer}</span>${src}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function uploadDoc() {
            const f = document.getElementById('fileInput').files[0];
            if (!f) return alert('请选择文件');
            const fd = new FormData();
            fd.append('file', f);
            // 第一次尝试上传
            let res = await fetch(`${API_BASE}/upload/?admin_secret=${getSecret()}`, {method:'POST', body:fd});
            let d = await res.json();
            // 存在同名文档：弹窗让管理员确认是否覆盖升级
            if (d.need_confirm) {
                const ok = confirm(`已存在同名文档《${f.name}》（当前版本 v${d.current_version}），确定覆盖并升级为新版本吗？`);
                if (!ok) return alert('已取消上传，旧版本保持不变');
                res = await fetch(`${API_BASE}/upload/?admin_secret=${getSecret()}&confirm=yes`, {method:'POST', body:fd});
                d = await res.json();
            }
            alert(d.msg ? `✅ 上传成功，自动分类：${d.category}，版本 v${d.version}` : (d.detail || d.error));
            loadDocs();
        }

        async function delDoc(id) {
            if (!confirm('确定删除？')) return;
            const res = await fetch(`${API_BASE}/documents/${id}?admin_secret=${getSecret()}`, {method:'DELETE'});
            alert((await res.json()).msg || '删除成功');
            loadDocs();
        }

        async function editCat(id, old) {
            const c = prompt('新分类（培养方案/考试通知/课件资料/行政通知/社团文件/未分类）：', old);
            if (!c) return;
            const res = await fetch(`${API_BASE}/admin/documents/${id}/category?new_category=${c}&admin_secret=${getSecret()}`, {method:'PUT'});
            const d = await res.json();
            alert(d.msg || d.detail);
            loadDocs();
        }

        async function showVer(id) {
            const res = await fetch(`${API_BASE}/admin/documents/${id}/versions?admin_secret=${getSecret()}`);
            const data = await res.json();
            if (data.detail) { alert(data.detail); return; }
            if (!data.length) { alert('没有历史版本'); return; }
            const lines = data.map(v => {
                const tag = v.is_latest ? '（当前最新版）' : '';
                const btn = v.is_latest ? '' : `<button class="btn btn-sm btn-warning ms-2" onclick="rollbackDoc(${v.id},${v.version})">回滚到此版本</button>`;
                return `<div class="py-1">v${v.version} ${tag}${btn}</div>`;
            }).join('');
            document.getElementById('verModalContent').innerHTML = lines;
            document.getElementById('verModalTitle').innerText = '历史版本';
            new bootstrap.Modal('#verModal').show();
        }

        async function rollbackDoc(docId, ver) {
            if (!confirm(`确定回滚到 v${ver} 吗？当前最新版将被标记为历史版。`)) return;
            const res = await fetch(`${API_BASE}/admin/documents/${docId}/rollback?admin_secret=${getSecret()}`, {method:'POST'});
            const d = await res.json();
            alert(d.msg || d.detail || '回滚成功');
            loadDocs();
        }
    </script>
</body>
</html>
