<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园资料AI检索助手</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="/static/docx-preview.min.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-2: #8b5cf6;
            --bg: #f3f5fb;
            --card: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
            --border: #e7ebf3;
            --grad: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            --shadow: 0 10px 30px rgba(99, 102, 241, .10);
            --shadow-sm: 0 2px 8px rgba(30, 41, 59, .06);
        }
        * { box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
            margin: 0;
            padding-top: 72px;
        }

        /* 顶部导航 */
        .navbar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 1030;
            background: rgba(255,255,255,.85);
            backdrop-filter: saturate(180%) blur(12px);
            border-bottom: 1px solid var(--border);
            height: 64px;
        }
        .navbar .brand { font-weight: 700; font-size: 18px; color: var(--text); }
        .brand .logo {
            width: 34px; height: 34px; border-radius: 10px;
            background: var(--grad); color: #fff;
            display: inline-flex; align-items: center; justify-content: center;
            margin-right: 10px; font-size: 17px; box-shadow: var(--shadow-sm);
        }
        .btn-grad {
            background: var(--grad); color: #fff; border: none;
            border-radius: 10px; padding: 8px 16px; font-weight: 600;
            transition: transform .12s ease, box-shadow .12s ease;
        }
        .btn-grad:hover { color: #fff; transform: translateY(-1px); box-shadow: 0 8px 20px rgba(99,102,241,.28); }
        .btn-ghost {
            background: transparent; color: var(--text); border: 1px solid var(--border);
            border-radius: 10px; padding: 8px 16px; font-weight: 600;
        }
        .btn-ghost:hover { background: #f1f3f9; }
        .user-chip {
            display: inline-flex; align-items: center; gap: 8px;
            background: #eef2ff; color: var(--primary);
            border-radius: 30px; padding: 6px 14px; font-weight: 600; font-size: 14px;
        }
        .user-chip .avatar {
            width: 24px; height: 24px; border-radius: 50%; background: var(--grad);
            color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 13px;
        }

        /* 布局 */
        .container { max-width: 1280px; }
        .hero { margin: 22px 0 6px; }
        .hero h1 { font-size: 26px; font-weight: 800; margin: 0; }
        .hero p { color: var(--muted); margin: 6px 0 0; }

        /* 卡片 */
        .card {
            border: 1px solid var(--border); border-radius: 16px;
            box-shadow: var(--shadow-sm); background: var(--card);
        }
        .card-head {
            padding: 16px 20px; border-bottom: 1px solid var(--border);
            font-weight: 700; display: flex; align-items: center; gap: 8px;
        }
        .card-body { padding: 20px; }

        /* 聊天 */
        .chat-box {
            height: 440px; overflow-y: auto; background: #f8fafc;
            border: 1px solid var(--border); border-radius: 14px; padding: 18px;
        }
        .msg { max-width: 82%; margin-bottom: 14px; display: flex; flex-direction: column; }
        .msg.user { align-items: flex-end; margin-left: auto; }
        .msg.ai { align-items: flex-start; }
        .bubble {
            border-radius: 16px; padding: 10px 14px; line-height: 1.6; font-size: 14px;
            white-space: pre-wrap; word-break: break-word;
        }
        .msg.user .bubble { background: var(--grad); color: #fff; border-bottom-right-radius: 4px; }
        .msg.ai .bubble { background: #fff; border: 1px solid var(--border); border-bottom-left-radius: 4px; box-shadow: var(--shadow-sm); }
        .source-tag {
            font-size: 12px; color: var(--muted); margin-top: 6px;
            padding: 5px 10px; background: #eef2ff; border-radius: 8px;
        }
        .input-bar { display: flex; gap: 10px; margin-top: 14px; }
        .input-bar input {
            flex: 1; border: 1px solid var(--border); border-radius: 12px;
            padding: 12px 16px; font-size: 14px; outline: none;
        }
        .input-bar input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99,102,241,.15); }

        /* 文档库 */
        .doc-search {
            border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px;
            width: 100%; font-size: 14px; outline: none; margin-bottom: 12px;
        }
        .doc-search:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99,102,241,.15); }
        .cat-card { border: 1px solid var(--border); border-radius: 12px; margin-bottom: 10px; overflow: hidden; }
        .cat-header {
            cursor: pointer; padding: 10px 14px; display: flex; align-items: center; gap: 8px;
            background: #fafbfe; user-select: none;
        }
        .cat-header:hover { background: #f1f3f9; }
        .cat-arrow { transition: transform .2s; color: var(--muted); font-size: 12px; }
        .cat-arrow.open { transform: rotate(90deg); }
        .cat-item { padding: 10px 14px; border-top: 1px solid #f2f4f9; }
        .doc-title { cursor: pointer; color: var(--primary); font-weight: 600; }
        .doc-title:hover { text-decoration: underline; }
        .badge-soft { font-size: 11px; padding: 3px 8px; border-radius: 6px; font-weight: 600; }
        .doc-actions { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }
        .btn-xs { font-size: 12px; padding: 3px 10px; border-radius: 8px; }

        .admin-card { margin-top: 16px; }
        .form-control.rounded { border-radius: 12px; }

        .modal-content { border-radius: 18px; border: none; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container d-flex align-items-center justify-content-between h-100">
            <div class="brand d-flex align-items-center">
                <span class="logo">✦</span>
                <span>校园资料AI检索助手</span>
            </div>
            <div class="d-flex align-items-center gap-2" id="navUserArea">
                <button class="btn btn-ghost" onclick="openAdminLogin()">管理员</button>
                <span id="userChip"></span>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="hero">
            <h1>📚 智能问答 · 文档知识库</h1>
            <p>上传培养方案、课件、通知等资料，用自然语言随时提问。</p>
        </div>

        <div class="row mt-2">
            <div class="col-lg-8">
                <div class="card mb-4">
                    <div class="card-head">智能问答（学生 / 管理员均可使用）</div>
                    <div class="card-body">
                        <div class="chat-box" id="chatBox">
                            <div class="msg ai">
                                <div class="bubble">你好！我是校园资料助手，可以问我关于上传文档里的内容哦～</div>
                            </div>
                        </div>
                        <div class="input-bar">
                            <input type="text" id="questionInput" placeholder="输入你的问题..." onkeydown="if(event.key==='Enter')askQuestion()">
                            <button class="btn btn-grad" onclick="askQuestion()">提问</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card mb-4">
                    <div class="card-head">文档库 · 按分类浏览</div>
                    <div class="card-body">
                        <input type="text" class="doc-search" id="searchInput" placeholder="搜索文件名..." oninput="searchDocs()">
                        <div class="d-grid mb-3">
                            <button class="btn btn-ghost w-100" id="sortBtn" onclick="toggleSort()">排序：按上传时间</button>
                        </div>
                        <div id="docList"><div class="text-muted small">加载中...</div></div>
                    </div>
                </div>

                <div class="card admin-card" id="loginPanel">
                    <div class="card-head">管理员登录</div>
                    <div class="card-body">
                        <input type="password" class="form-control rounded mb-2" id="adminSecret" placeholder="输入管理员密钥">
                        <button class="btn btn-grad w-100" onclick="loginAdmin()">登录管理员</button>
                    </div>
                </div>

                <div class="card admin-card" id="adminPanel" style="display:none;">
                    <div class="card-head">管理员控制台（已解锁）</div>
                    <div class="card-body">
                        <input type="file" class="form-control rounded mb-2" id="fileInput" accept=".pdf,.doc,.docx,.txt">
                        <button class="btn btn-grad w-100 mb-2" onclick="uploadDoc()">上传文档</button>
                        <button class="btn btn-ghost w-100" onclick="logoutAdmin()">退出管理员模式</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 文档详情 -->
    <div class="modal fade" id="docModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="docModalTitle">文档详情</h5>
                    <div class="d-flex gap-2 align-items-center">
                        <a id="docFileBtn" href="#" target="_blank" class="btn btn-sm btn-ghost">打开原文件</a>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                </div>
                <div class="modal-body" id="docModalContent" style="white-space: pre-wrap; max-height: 600px; overflow-y: auto;"></div>
            </div>
        </div>
    </div>

    <!-- 历史版本 -->
    <div class="modal fade" id="verModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="verModalTitle">历史版本</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="verModalContent"></div>
            </div>
        </div>
    </div>

    <!-- 登录 -->
    <div class="modal fade" id="loginModal" tabindex="-1">
        <div class="modal-dialog modal-sm">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">用户登录</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-2 text-muted small">没有账号？<a href="#" onclick="openRegister()">去注册</a></div>
                    <input type="text" class="form-control rounded mb-2" id="loginUsername" placeholder="用户名">
                    <input type="password" class="form-control rounded mb-3" id="loginPassword" placeholder="密码">
                    <button class="btn btn-grad w-100" onclick="loginUser()">登录</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 注册 -->
    <div class="modal fade" id="registerModal" tabindex="-1">
        <div class="modal-dialog modal-sm">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">用户注册</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-2 text-muted small">已有账号？<a href="#" onclick="openLogin()">去登录</a></div>
                    <input type="text" class="form-control rounded mb-2" id="regUsername" placeholder="用户名">
                    <input type="password" class="form-control rounded mb-3" id="regPassword" placeholder="密码（至少4位）">
                    <button class="btn btn-grad w-100" onclick="registerUser()">注册</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE = "http://127.0.0.1:8000";
        let sortMode = 'time';
        const catColors = {
            '培养方案': { bg: '#eef2ff', txt: '#4f46e5' },
            '考试通知': { bg: '#fee2e2', txt: '#dc2626' },
            '课件资料': { bg: '#dcfce7', txt: '#16a34a' },
            '行政通知': { bg: '#fef3c7', txt: '#b45309' },
            '社团文件': { bg: '#f1f5f9', txt: '#475569' },
            '作业': { bg: '#f3e8ff', txt: '#7c3aed' },
            '未分类': { bg: '#e0f2fe', txt: '#0369a1' }
        };

        window.onload = function () {
            loadDocs();
            if (localStorage.getItem('adminSecret') === 'admin123456') {
                showAdminPanel();
                loadDocs();
            }
            updateUserUI();
        };

        /* ===== 用户登录态 ===== */
        function currentUser() { return localStorage.getItem('username') || ''; }
        function updateUserUI() {
            const u = currentUser();
            const chip = document.getElementById('userChip');
            const nav = document.getElementById('navUserArea');
            if (u) {
                chip.innerHTML = `<span class="user-chip"><span class="avatar">${u[0]}</span>${u}</span>
                    <button class="btn btn-ghost" onclick="logoutUser()">退出</button>`;
            } else {
                chip.innerHTML = `<button class="btn btn-ghost" onclick="openLogin()">登录</button>
                    <button class="btn btn-grad" onclick="openRegister()">注册</button>`;
            }
        }
        function openLogin() {
            document.getElementById('loginPassword').value = '';
            new bootstrap.Modal(document.getElementById('loginModal')).show();
        }
        function openRegister() {
            document.getElementById('regPassword').value = '';
            bootstrap.Modal.getInstance(document.getElementById('loginModal'))?.hide();
            new bootstrap.Modal(document.getElementById('registerModal')).show();
        }
        async function loginUser() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            if (!username || !password) return alert('请输入用户名和密码');
            const res = await fetch(`${API_BASE}/login/?username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`, { method: 'POST' });
            const d = await res.json();
            if (res.ok) {
                localStorage.setItem('username', d.username);
                localStorage.setItem('user_id', d.user_id);
                bootstrap.Modal.getInstance(document.getElementById('loginModal')).hide();
                updateUserUI();
                alert('登录成功，欢迎 ' + d.username);
            } else {
                alert(d.detail || '登录失败');
            }
        }
        async function registerUser() {
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value;
            if (!username || !password) return alert('请输入用户名和密码');
            const res = await fetch(`${API_BASE}/register/?username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`, { method: 'POST' });
            const d = await res.json();
            if (res.ok) {
                localStorage.setItem('username', d.username);
                localStorage.setItem('user_id', d.user_id);
                bootstrap.Modal.getInstance(document.getElementById('registerModal')).hide();
                updateUserUI();
                alert('注册成功，已自动登录：' + d.username);
            } else {
                alert(d.detail || '注册失败');
            }
        }
        function logoutUser() {
            localStorage.removeItem('username');
            localStorage.removeItem('user_id');
            updateUserUI();
        }

        /* ===== 管理员 ===== */
        function openAdminLogin() {
            const p = document.getElementById('loginPanel');
            document.getElementById('adminSecret').focus();
            p.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        function showAdminPanel() {
            document.getElementById('adminPanel').style.display = 'block';
            document.getElementById('loginPanel').style.display = 'none';
        }
        function loginAdmin() {
            if (document.getElementById('adminSecret').value === 'admin123456') {
                localStorage.setItem('adminSecret', 'admin123456');
                showAdminPanel();
                loadDocs();
                alert('管理员登录成功');
            } else {
                alert('密钥错误');
            }
        }
        function logoutAdmin() {
            localStorage.removeItem('adminSecret');
            location.reload();
        }
        function getSecret() { return localStorage.getItem('adminSecret') || ''; }

        /* ===== 文档库 ===== */
        function toggleSort() {
            sortMode = sortMode === 'time' ? 'name' : 'time';
            document.getElementById('sortBtn').innerText = sortMode === 'time' ? '排序：按文件名' : '排序：按上传时间';
            loadDocs();
        }
        async function loadDocs() {
            const res = await fetch(`${API_BASE}/documents/`);
            let docs = await res.json();
            if (sortMode === 'name') docs = docs.sort((a, b) => a.filename.localeCompare(b.filename, 'zh'));
            renderDocList(docs);
        }
        async function searchDocs() {
            const k = document.getElementById('searchInput').value.trim();
            if (!k) return loadDocs();
            const res = await fetch(`${API_BASE}/documents/search/?keyword=${encodeURIComponent(k)}`);
            let docs = await res.json();
            if (sortMode === 'name') docs = docs.sort((a, b) => a.filename.localeCompare(b.filename, 'zh'));
            renderDocList(docs);
        }
        function renderDocList(docs) {
            const el = document.getElementById('docList');
            if (!docs.length) {
                el.innerHTML = '<div class="text-muted small">暂无文档</div>';
                return;
            }
            const isAdmin = !!localStorage.getItem('adminSecret');
            const groups = {};
            docs.forEach(d => {
                const cat = d.category || '未分类';
                (groups[cat] = groups[cat] || []).push(d);
            });
            let html = '';
            let idx = 0;
            Object.keys(groups).forEach(cat => {
                const list = groups[cat];
                const c = catColors[cat] || catColors['未分类'];
                html += `
                    <div class="cat-card">
                        <div class="cat-header" data-bs-toggle="collapse" data-bs-target="#cat-${idx}" aria-expanded="false">
                            <span class="badge-soft" style="background:${c.bg};color:${c.txt}">${cat}</span>
                            <span class="text-muted small">${list.length} 个文档</span>
                            <span class="cat-arrow ms-auto">▸</span>
                        </div>
                        <div id="cat-${idx}" class="collapse">
                            ${list.map(d => docItemHtml(d, isAdmin)).join('')}
                        </div>
                    </div>`;
                idx++;
            });
            el.innerHTML = html;
        }
        function docItemHtml(d, isAdmin) {
            return `
                <div class="cat-item">
                    <div class="d-flex align-items-center justify-content-between">
                        <span class="doc-title" onclick="viewDoc(${d.id})">${d.filename}</span>
                        <span class="badge-soft" style="background:#f1f5f9;color:#64748b">v${d.version}</span>
                    </div>
                    ${isAdmin ? `<div class="doc-actions">
                        <button class="btn btn-xs btn-outline-primary" onclick="editCat(${d.id},'${d.category}')">改分类</button>
                        <button class="btn btn-xs btn-outline-secondary" onclick="showVer(${d.id})">历史版本</button>
                        <button class="btn btn-xs btn-outline-danger" onclick="delDoc(${d.id})">删除</button>
                    </div>` : ''}
                </div>`;
        }
        async function viewDoc(id) {
            const res = await fetch(`${API_BASE}/documents/${id}`);
            const doc = await res.json();
            document.getElementById('docModalTitle').innerText = doc.filename;
            document.getElementById('docFileBtn').href = `${API_BASE}/file/${id}`;
            document.getElementById('docModalContent').innerText = doc.content;
            new bootstrap.Modal(document.getElementById('docModal')).show();
        }

        /* ===== 问答 ===== */
        async function askQuestion() {
            const q = document.getElementById('questionInput').value.trim();
            if (!q) return;
            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML += `<div class="msg user"><div class="bubble">${q}</div></div>`;
            document.getElementById('questionInput').value = '';
            chatBox.scrollTop = chatBox.scrollHeight;
            const res = await fetch(`${API_BASE}/ask/?q=${encodeURIComponent(q)}`, { method: 'POST' });
            const data = await res.json();
            let src = '';
            if (data.sources && data.sources.length) {
                src = `<div class="source-tag">参考：${data.sources.map(s => s.doc_name).join('、')}</div>`;
            }
            chatBox.innerHTML += `<div class="msg ai"><div class="bubble">${data.answer}</div>${src}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        /* ===== 管理员操作 ===== */
        async function uploadDoc() {
            const f = document.getElementById('fileInput').files[0];
            if (!f) return alert('请选择文件');
            const fd = new FormData();
            fd.append('file', f);
            let res = await fetch(`${API_BASE}/upload/?admin_secret=${getSecret()}`, { method: 'POST', body: fd });
            let d = await res.json();
            if (d.need_confirm) {
                const ok = confirm(`已存在同名文档《${f.name}》（当前版本 v${d.current_version}），确定覆盖并升级为新版本吗？`);
                if (!ok) return alert('已取消上传，旧版本保持不变');
                res = await fetch(`${API_BASE}/upload/?admin_secret=${getSecret()}&confirm=yes`, { method: 'POST', body: fd });
                d = await res.json();
            }
            alert(d.msg ? `上传成功，自动分类：${d.category}，版本 v${d.version}` : (d.detail || d.error));
            loadDocs();
        }
        async function delDoc(id) {
            if (!confirm('确定删除？')) return;
            const res = await fetch(`${API_BASE}/documents/${id}?admin_secret=${getSecret()}`, { method: 'DELETE' });
            alert((await res.json()).msg || '删除成功');
            loadDocs();
        }
        async function editCat(id, old) {
            const c = prompt('新分类（培养方案/考试通知/课件资料/行政通知/社团文件/未分类）：', old);
            if (!c) return;
            const res = await fetch(`${API_BASE}/admin/documents/${id}/category?new_category=${c}&admin_secret=${getSecret()}`, { method: 'PUT' });
            const d = await res.json();
            alert(d.msg || d.detail);
            loadDocs();
        }
        async function showVer(id) {
            const res = await fetch(`${API_BASE}/admin/documents/${id}/versions?admin_secret=${getSecret()}`);
            const data = await res.json();
            if (data.detail) { alert(data.detail); return; }
            if (!data.length) { alert('没有历史版本'); return; }
            const lines = data.map(v => {
                const tag = v.is_latest ? '<span class="badge-soft" style="background:#dcfce7;color:#16a34a">当前最新版</span>' : '';
                const btn = v.is_latest ? '' : `<button class="btn btn-xs btn-warning ms-2" onclick="rollbackDoc(${v.id},${v.version})">回滚到此版本</button>`;
                return `<div class="py-2 d-flex align-items-center gap-2">v${v.version} ${tag}${btn}</div>`;
            }).join('');
            document.getElementById('verModalContent').innerHTML = lines;
            document.getElementById('verModalTitle').innerText = '历史版本';
            new bootstrap.Modal(document.getElementById('verModal')).show();
        }
        async function rollbackDoc(docId, ver) {
            if (!confirm(`确定回滚到 v${ver} 吗？当前最新版将被标记为历史版。`)) return;
            const res = await fetch(`${API_BASE}/admin/documents/${docId}/rollback?admin_secret=${getSecret()}`, { method: 'POST' });
            const d = await res.json();
            alert(d.msg || d.detail || '回滚成功');
            loadDocs();
        }
    </script>
</body>
